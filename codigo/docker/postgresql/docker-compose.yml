# Definir un contenedor de postgres y la BD se restaura desde dentro del contenedor

# services:
#   servicio1:

#   servicio2:


services:
  postgres_dev:
    image: postgres:16
    container_name: postgres_dev
    restart: always
    enviroment:
      POSTGRES_DB: empresa3
      POSTGRES_USER: antonio
      POSTGRES_PASSWORD: antonio
      
    ports:
      - "5433:5432"
      
    volumes:
      - pg_data:/var/lib/postgresql/data
      
volumes:
  pg_data:
    
    
